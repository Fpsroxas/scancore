id: com.mediumdev.scancore
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# Qt WebEngine for the anime player and browser checks. Flathub builds it
# with the H.264 codec the episodes use.
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: scancore
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  # Discord Rich Presence (off unless turned on in Settings → Connections):
  # the Discord app's socket, native or Flatpak.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: scancore
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSCANCORE_BUILD_TESTS=OFF
      - -DSCANCORE_WITH_NOVEL_PACK_INSTALLER=OFF
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_LEXBOR=/run/build/scancore/lexbor
    sources:
      - type: git
        url: https://github.com/medium-gh/scancore.git
        tag: v1.2.0
      - type: git
        url: https://github.com/lexbor/lexbor.git
        tag: v2.7.0
        commit: de30a79397f8db1c22bce2fd5a792d84fd065762
        dest: lexbor
