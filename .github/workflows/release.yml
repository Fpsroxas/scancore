name: Release

# Push a tag like v0.1.0 to build installers for Linux, Windows and macOS
# and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  QT_VERSION: 6.11.3
  # The AppImage's Qt. Its Qt WebEngine is rebuilt with H.264 from Qt's
  # published sources (qtwebengine.yml), and Qt has not published 6.11.3's.
  LINUX_QT_VERSION: 6.11.2
  # qtwebview: the anime player on Windows (WebView2) and macOS (WKWebView).
  QT_MODULES: qtwebengine qtwebview qtwebchannel qtpositioning qtimageformats qtpdf

jobs:
  # Fails within seconds when the tag and the app's own version differ,
  # before any platform is built. Installed copies compare the version the
  # app reports, so a mismatch would keep offering the same update.
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      linuxQt: ${{ env.LINUX_QT_VERSION }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches CMakeLists.txt
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PROJECT_VERSION=$(sed -nE '/^project\(/,/\)/ s/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error file=CMakeLists.txt::No VERSION found in project() in CMakeLists.txt."
            exit 1
          fi
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error file=CMakeLists.txt::Tag $TAG does not match the app version $PROJECT_VERSION in CMakeLists.txt. Set VERSION $VERSION in project() and tag again, or tag v$PROJECT_VERSION."
            exit 1
          fi
          echo "Tag $TAG matches CMakeLists.txt."

  # Build codecs while the other release targets build. Only the Linux
  # AppImage needs this; other release artifacts can publish independently.
  webengine:
    needs: version
    uses: ./.github/workflows/qtwebengine.yml
    with:
      qt: ${{ needs.version.outputs.linuxQt }}

  build:
    name: ${{ matrix.name }}
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            # aqtinstall cannot read the Windows 6.11 repository layout yet.
            qt: 6.10.3
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr $EXTRA
          cmake --build build --parallel

      # ---------------------------------------------------------------- Windows
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item build\bin\scancore.exe dist\windows\
          windeployqt --release --qmldir src\qml --no-translations --compiler-runtime dist\windows\scancore.exe
          # The anime player's WebView2 backend, which windeployqt may leave out.
          if (-not (Test-Path dist\windows\plugins\webview\qtwebview_webview2.dll)) {
            New-Item -ItemType Directory -Force dist\windows\plugins\webview | Out-Null
            Copy-Item "$env:QT_ROOT_DIR\plugins\webview\qtwebview_webview2.dll" dist\windows\plugins\webview\
          }
          Compress-Archive -Path dist\windows\* -DestinationPath "dist\SCANCORE-$env:VERSION-windows-x64-portable.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows" `
            "/O$PWD\dist" packaging\windows\scancore.iss

      # ---------------------------------------------------------------- macOS
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          cp -R build/bin/scancore.app SCANCORE.app
          # The anime player's WKWebView backend, in case macdeployqt leaves it
          # out; listed with -executable so its Qt references are rewritten.
          mkdir -p SCANCORE.app/Contents/PlugIns/webview
          cp "$QT_ROOT_DIR/plugins/webview/libqtwebview_darwin.dylib" SCANCORE.app/Contents/PlugIns/webview/
          macdeployqt SCANCORE.app -qmldir=src/qml -dmg -always-overwrite \
            -executable=SCANCORE.app/Contents/PlugIns/webview/libqtwebview_darwin.dylib
          mkdir -p dist && mv SCANCORE.dmg "dist/SCANCORE-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: scancore-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/*.dmg
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    needs: [version, webengine, publish]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.webengine.result == 'success' && needs.webengine.outputs.available == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "LINUX_QT_VERSION=${{ needs.version.outputs.linuxQt }}" >> "$GITHUB_ENV"

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1-dev libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libfuse2 file

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.version.outputs.linuxQt }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Qt WebEngine with codecs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "qtwebengine-$LINUX_QT_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "qtwebengine-$LINUX_QT_VERSION-codecs-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP"
          tar -xJf "$RUNNER_TEMP/qtwebengine-$LINUX_QT_VERSION-codecs-linux-x86_64.tar.xz" -C "$QT_ROOT_DIR"
          echo "Qt WebEngine with codecs laid over $QT_ROOT_DIR."

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: AppImage
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -delete
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          find "$QT_ROOT_DIR/plugins" -name '*.so' | while read -r plugin; do
            if ldd "$plugin" | grep -q 'not found'; then
              echo "Removing $plugin (unresolved: $(ldd "$plugin" | grep 'not found' | awk '{print $1}' | paste -sd' '))"
              rm -f "$plugin"
            fi
          done
          export QML_SOURCES_PATHS=$PWD/src/qml
          export EXTRA_QT_MODULES="svg"
          PLUGINS=$(ls "$QT_ROOT_DIR/plugins/platforms" | grep -i wayland | paste -sd ';' || true)
          [ -n "$PLUGINS" ] && export EXTRA_PLATFORM_PLUGINS="$PLUGINS"
          echo "Wayland plugins: $PLUGINS"
          export LDAI_OUTPUT=SCANCORE-$VERSION-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file packaging/linux/com.mediumdev.scancore.desktop \
            --icon-file packaging/linux/com.mediumdev.scancore.png \
            --plugin qt
          for dir in "$QT_ROOT_DIR"/plugins/wayland-*; do
            [ -d "$dir" ] && cp -r "$dir" AppDir/usr/plugins/
          done
          rm -f AppDir/usr/lib/libnss3.so AppDir/usr/lib/libnssutil3.so AppDir/usr/lib/libsmime3.so \
                AppDir/usr/lib/libnspr4.so AppDir/usr/lib/libplc4.so AppDir/usr/lib/libplds4.so
          LIBS=$(find AppDir/usr/plugins/wayland-* -name '*.so' -printf ' --library %p' 2>/dev/null || true)
          NSS_EXCLUDES=""
          for lib in libnss3 libnssutil3 libsmime3 libnspr4 libplc4 libplds4; do
            NSS_EXCLUDES="$NSS_EXCLUDES --exclude-library $lib.so*"
          done
          ./linuxdeploy-x86_64.AppImage --appdir AppDir $LIBS $NSS_EXCLUDES --output appimage
          if ls AppDir/usr/lib | grep -E '^lib(nss3|nssutil3|smime3|nspr4|plc4|plds4)\.so'; then
            echo "NSS libraries were bundled; the anime player would crash on newer distributions" >&2
            exit 1
          fi
          mkdir -p dist && mv SCANCORE-*.AppImage dist/

      - name: Add AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.tag || github.ref_name }}" dist/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          cache: true

      - name: Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          # Qt 6.7+ publishes Android packages under the all_os host.
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtwebview qtimageformats qtwebchannel qtpositioning
          cache: true

      - name: Signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scancore.jks"
          export QT_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/scancore.jks" QT_ANDROID_KEYSTORE_ALIAS=scancore
          export QT_ANDROID_KEYSTORE_STORE_PASS="$KEYSTORE_PASSWORD" QT_ANDROID_KEYSTORE_KEY_PASS="$KEYSTORE_PASSWORD"
          HOST_QT=$(dirname "$QT_ROOT_DIR")/gcc_64
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$HOST_QT" -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON
          cmake --build build --parallel
          cmake --build build --target apk
          mkdir -p dist
          cp build/src/android-build/build/outputs/apk/release/android-build-release-signed.apk \
            "dist/SCANCORE-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: scancore-Android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    # Publish the independent desktop and Android artifacts without waiting
    # for the hours-long Linux codec build.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android.result == 'success' }}
    # Pinned: ubuntu-latest moves to a new release from 19 October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The release page stays short so the downloads stay in view: an optional
      # one-line summary (a plain line right under the version's heading in
      # CHANGELOG.md), a link to the full entry and which file to download.
      - name: Release notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          HEADING=$(awk -v v="$VERSION" 'index($0, "## " v " ") == 1 || $0 == "## " v { print substr($0, 4); exit }' CHANGELOG.md)
          ANCHOR=$(printf '%s' "$HEADING" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 -]//g; s/ /-/g')
          SUMMARY=$(awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            on && NF { if ($0 !~ /^[-*#]/) print; exit }' CHANGELOG.md)
          cat > notes.md <<EOF
          ${SUMMARY:+$SUMMARY }[Full changelog](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md#$ANCHOR)

          | System | Download |
          | --- | --- |
          | Windows | \`windows-x64-setup.exe\` or portable \`.zip\` |
          | macOS 13+ | \`macos-universal.dmg\` |
          | Linux | \`linux-x86_64.AppImage\` or \`.flatpak\` |
          | Android 9+ | \`android-arm64.apk\` |
          EOF
          cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SCANCORE ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*

  # AUR, Homebrew and winget manifests with this release's checksums, ready
  # to submit (see packaging/update-manifests.py).
  manifests:
    name: Package manifests
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Write and attach the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ ! -f packaging/update-manifests.py ]; then
            echo "::notice::$TAG predates packaging/update-manifests.py."
            exit 0
          fi
          python3 packaging/update-manifests.py "$VERSION" --out "$RUNNER_TEMP/manifests"
          (cd "$RUNNER_TEMP/manifests" && zip -qr "$RUNNER_TEMP/SCANCORE-$VERSION-package-manifests.zip" .)
          gh release upload "$TAG" "$RUNNER_TEMP/SCANCORE-$VERSION-package-manifests.zip" --repo "$GITHUB_REPOSITORY" --clobber
