name: Qt WebEngine with codecs

# Qt's own Linux packages build Qt WebEngine without the H.264 and AAC
# codecs, and every anime episode uses them, so an AppImage made from those
# packages cannot play anything. This builds the same Qt WebEngine version
# with the codecs enabled, against Qt's own packages, and keeps it as an
# asset of a "qtwebengine-<version>" pre-release (pre-releases are never
# offered as app updates). The release workflow lays it over Qt before it
# builds the AppImage.
#
# The build takes longer than one job may run, so it runs in parts that
# continue from each other (qtwebengine-part.yml), and only when that asset
# does not exist yet. Run it by hand ahead of a release that changes the
# AppImage's Qt (LINUX_QT_VERSION in release.yml).

on:
  workflow_dispatch:
    inputs:
      qt:
        description: Qt version, e.g. 6.11.2
        required: true
        type: string
  workflow_call:
    inputs:
      qt:
        required: true
        type: string
    outputs:
      available:
        description: "'true' when the asset exists (already, or now)"
        value: ${{ jobs.result.outputs.available }}

permissions:
  contents: write

jobs:
  existing:
    name: Already built?
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: qtwebengine-${{ inputs.qt }}
          ASSET: qtwebengine-${{ inputs.qt }}-codecs-linux-x86_64.tar.xz
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$ASSET"; then
            echo "Found $ASSET in release $TAG."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  # Each part runs only when the one before ran out of time.
  part1:
    needs: existing
    if: needs.existing.outputs.found != 'true'
    uses: ./.github/workflows/qtwebengine-part.yml
    with:
      qt: ${{ inputs.qt }}
      part: 1
  part2:
    needs: part1
    if: needs.part1.outputs.done == 'false'
    uses: ./.github/workflows/qtwebengine-part.yml
    with:
      qt: ${{ inputs.qt }}
      part: 2
  part3:
    needs: part2
    if: needs.part2.outputs.done == 'false'
    uses: ./.github/workflows/qtwebengine-part.yml
    with:
      qt: ${{ inputs.qt }}
      part: 3
  part4:
    needs: part3
    if: needs.part3.outputs.done == 'false'
    uses: ./.github/workflows/qtwebengine-part.yml
    with:
      qt: ${{ inputs.qt }}
      part: 4
      last: true

  result:
    name: Result
    needs: [existing, part1, part2, part3, part4]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.done.outputs.available }}
    steps:
      - id: done
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: qtwebengine-${{ inputs.qt }}
          ASSET: qtwebengine-${{ inputs.qt }}-codecs-linux-x86_64.tar.xz
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$ASSET"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
