name: Bug report
description: Something crashes, looks wrong or does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Anime
        2. Pick a series and press Watch
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SCANCORE version
      description: Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS, Android]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System details
      description: OS version and, for Linux, distribution, desktop and Wayland or X11. For Android, the phone model.
  - type: input
    id: source
    attributes:
      label: Source and series URL
      description: For a source problem, the site and a series URL that shows it.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Linux/macOS: run SCANCORE from a terminal and paste the output.
        Android: `adb logcat -d | grep -iE "scancore|qt|FATAL"` with the phone connected.
      render: text
